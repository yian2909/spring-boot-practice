  oss:
    # oss 对外服务的访问域名
    endpoint: https://oss-cn-hangzhou.aliyuncs.com
    # 访问身份验证中用到用户标识
    accessKeyId: LTAI5tMUpntrGxqt6ZLrCw5s
    # 用户用于加密签名字符串和 oss 用来验证签名字符串的密钥
    accessKeySecret: hXbObSeZpDyQYFAYBC34UwIILQOQpX
    # oss的存储空间名
    bucketName: yian2909-bucket

