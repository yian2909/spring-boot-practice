<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sse-domo2</title>

<body>
<div id="result"></div>
<script>
    const source = new EventSource('http://localhost:8080/server/data');
    source.onmessage = function (event){
        console.info(event.data);
        document.getElementById('result').innerText = event.data
    };
</script>
